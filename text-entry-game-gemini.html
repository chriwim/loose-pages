<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteor Type Command - Typing Experiment</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
            border: 2px solid #1e3a8a;
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #050515, #111827);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 5, 21, 0.85);
            z-index: 10;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            color: #60a5fa;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(96, 165, 250, 0.5);
        }

        p {
            color: #9ca3af;
            max-width: 500px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.5);
        }

        .btn:hover {
            background-color: #1d4ed8;
            transform: scale(1.05);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background: #1f2937;
            padding: 15px 25px;
            border-radius: 6px;
            margin-bottom: 25px;
            border: 1px solid #374151;
            text-align: left;
        }

        .stat-item span {
            color: #60a5fa;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h1>METEOR TYPE COMMAND</h1>
            <p>Defend your cities by typing the English words attached to incoming meteors. Incorrect keystrokes increase your error rate!</p>
            <button class="btn" id="start-btn">START EXPERIMENT</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay hidden">
            <h1>EXPERIMENT COMPLETE</h1>
            <p>Your cities have fallen! Here are your typing performance metrics:</p>
            <div class="stats-grid">
                <div class="stat-item">Final WPM: <span id="final-wpm">0</span></div>
                <div class="stat-item">Accuracy: <span id="final-acc">0%</span></div>
                <div class="stat-item">Error Rate: <span id="final-err">0%</span></div>
                <div class="stat-item">Words Destroyed: <span id="final-words">0</span></div>
            </div>
            <button class="btn" id="restart-btn">PLAY AGAIN</button>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const finalWpmEl = document.getElementById('final-wpm');
    const finalAccEl = document.getElementById('final-acc');
    const finalErrEl = document.getElementById('final-err');
    const finalWordsEl = document.getElementById('final-words');

    // Word Bank for Meteors
    const wordBank = [
        "apple", "orbit", "space", "planet", "rocket", "stellar", "comet", "galaxy",
        "meteor", "gravity", "nebula", "laser", "shield", "radar", "signal", "pilot",
        "station", "eclipse", "cosmos", "voyage", "pulsar", "quasar", "meteorite",
        "asteroid", "fusion", "plasma", "shuttle", "horizon", "matrix", "quantum",
        "vector", "velocity", "terminal", "protocol", "firewall", "network", "system",
        "cipher", "kernel", "packet", "router", "gateway", "syntax", "runtime", "buffer"
    ];

    // Game State
    let gameActive = false;
    let score = 0;
    let wordsDestroyed = 0;
    let meteors = [];
    let particles = [];
    let cities = [];
    let spawnTimer = 0;
    let spawnInterval = 120; // Frames between spawns

    // Typing Metrics
    let startTime = 0;
    let totalKeystrokes = 0;
    let correctKeystrokes = 0;
    let errorCount = 0;
    let activeTarget = null; // Meteor currently being typed

    class City {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.width = 60;
            this.height = 25;
            this.alive = true;
        }

        draw() {
            if (!this.alive) return;
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(this.x - this.width / 2, this.y, this.width, this.height);
            // City details (windows)
            ctx.fillStyle = '#93c5fd';
            ctx.fillRect(this.x - 20, this.y + 5, 8, 8);
            ctx.fillRect(this.x + 12, this.y + 5, 8, 8);
        }
    }

    class Meteor {
        constructor(word, targetCity) {
            this.word = word;
            this.x = Math.random() * (canvas.width - 100) + 50;
            this.y = 0;
            this.targetCity = targetCity;
            this.speed = 0.8 + Math.random() * 0.7; // Fall speed
            
            // Calculate trajectory towards target city
            const dx = targetCity.x - this.x;
            const dy = targetCity.y - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            this.vx = (dx / dist) * this.speed;
            this.vy = (dy / dist) * this.speed;
            
            this.typedIndex = 0; // How many letters matched so far
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;

            // Check if reached city
            if (this.y >= this.targetCity.y) {
                this.targetCity.alive = false;
                createExplosion(this.x, this.y, '#ef4444', 30);
                return true; // Mark for removal
            }
            return false;
        }

        draw() {
            // Draw meteor head
            ctx.beginPath();
            ctx.arc(this.x, this.y, 8, 0, Math.PI * 2);
            ctx.fillStyle = activeTarget === this ? '#f59e0b' : '#ef4444';
            ctx.fill();
            ctx.closePath();

            // Draw trailing tail
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x - this.vx * 15, this.y - this.vy * 15);
            ctx.strokeStyle = activeTarget === this ? 'rgba(245, 158, 11, 0.4)' : 'rgba(239, 68, 68, 0.4)';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Render word with typed letters highlighted
            ctx.font = '16px "Courier New", Courier, monospace';
            const matchedPart = this.word.substring(0, this.typedIndex);
            const remainingPart = this.word.substring(this.typedIndex);

            const textWidth = ctx.measureText(this.word).width;
            const startX = this.x - textWidth / 2;
            const startY = this.y + 25;

            // Matched text (green/cyan)
            ctx.fillStyle = '#34d399';
            ctx.fillText(matchedPart, startX, startY);

            // Remaining text (white/yellow)
            const matchedWidth = ctx.measureText(matchedPart).width;
            ctx.fillStyle = activeTarget === this ? '#fbbf24' : '#e5e7eb';
            ctx.fillText(remainingPart, startX + matchedWidth, startY);
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 4 + 1;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.alpha = 1;
            this.decay = Math.random() * 0.03 + 0.015;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= this.decay;
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.alpha);
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    function initCities() {
        cities = [
            new City(150, canvas.height - 40),
            new City(400, canvas.height - 40),
            new City(650, canvas.height - 40)
        ];
    }

    function startGame() {
        gameActive = true;
        score = 0;
        wordsDestroyed = 0;
        meteors = [];
        particles = [];
        spawnTimer = 0;
        totalKeystrokes = 0;
        correctKeystrokes = 0;
        errorCount = 0;
        activeTarget = null;
        startTime = Date.now();

        initCities();
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        
        requestAnimationFrame(gameLoop);
    }

    function createExplosion(x, y, color, count = 20) {
        for (let i = 0; i < count; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function spawnMeteor() {
        // Only target alive cities
        const aliveCities = cities.filter(c => c.alive);
        if (aliveCities.length === 0) return;

        const targetCity = aliveCities[Math.floor(Math.random() * aliveCities.length)];
        const randomWord = wordBank[Math.floor(Math.random() * wordBank.length)];
        
        // Prevent duplicate active words if possible
        meteors.push(new Meteor(randomWord, targetCity));
    }

    // Handle Keyboard Input
    window.addEventListener('keydown', (e) => {
        if (!gameActive) return;

        // Only process alphabetical characters
        if (e.key.length === 1 && e.key >= 'a' && e.key <= 'z') {
            totalKeystrokes++;
            const char = e.key;

            if (activeTarget) {
                // We have an active target meteor
                if (activeTarget.word[activeTarget.typedIndex] === char) {
                    activeTarget.typedIndex++;
                    correctKeystrokes++;

                    // Check if word is fully typed
                    if (activeTarget.typedIndex === activeTarget.word.length) {
                        createExplosion(activeTarget.x, activeTarget.y, '#34d399', 25);
                        meteors = meteors.filter(m => m !== activeTarget);
                        activeTarget = null;
                        wordsDestroyed++;
                        score += 100;
                    }
                } else {
                    errorCount++;
                }
            } else {
                // No active target, look for any meteor starting with this letter
                const matchingMeteor = meteors.find(m => m.word[0] === char && m.typedIndex === 0);
                if (matchingMeteor) {
                    activeTarget = matchingMeteor;
                    activeTarget.typedIndex++;
                    correctKeystrokes++;

                    if (activeTarget.typedIndex === activeTarget.word.length) {
                        createExplosion(activeTarget.x, activeTarget.y, '#34d399', 25);
                        meteors = meteors.filter(m => m !== activeTarget);
                        activeTarget = null;
                        wordsDestroyed++;
                        score += 100;
                    }
                } else {
                    errorCount++;
                }
            }
        }
    });

    function calculateMetrics() {
        const elapsedTimeMinutes = (Date.now() - startTime) / 60000;
        if (elapsedTimeMinutes <= 0) return { wpm: 0, accuracy: 100, errorRate: 0 };

        // Standard WPM formula: (correct characters / 5) / minutes
        const wpm = Math.round((correctKeystrokes / 5) / elapsedTimeMinutes);
        
        const accuracy = totalKeystrokes > 0 
            ? Math.max(0, Math.round(((totalKeystrokes - errorCount) / totalKeystrokes) * 100)) 
            : 100;
            
        const errorRate = totalKeystrokes > 0 
            ? Math.min(100, Math.round((errorCount / totalKeystrokes) * 100)) 
            : 0;

        return { wpm, accuracy, errorRate };
    }

    function gameOver() {
        gameActive = false;
        const metrics = calculateMetrics();

        finalWpmEl.textContent = metrics.wpm;
        finalAccEl.textContent = metrics.accuracy + '%';
        finalErrEl.textContent = metrics.errorRate + '%';
        finalWordsEl.textContent = wordsDestroyed;

        gameOverScreen.classList.remove('hidden');
    }

    function gameLoop() {
        if (!gameActive) return;

        // Clear Screen
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Spawn logic
        spawnTimer++;
        if (spawnTimer >= spawnInterval) {
            spawnMeteor();
            spawnTimer = 0;
            // Gradually increase spawn rate as time goes on
            if (spawnInterval > 60) spawnInterval -= 2;
        }

        // Update & Draw Cities
        cities.forEach(city => city.draw());

        // Update & Draw Meteors
        for (let i = meteors.length - 1; i >= 0; i--) {
            const hitCity = meteors[i].update();
            if (hitCity) {
                if (activeTarget === meteors[i]) {
                    activeTarget = null;
                }
                meteors.splice(i, 1);

                // Check if all cities are destroyed
                if (cities.every(c => !c.alive)) {
                    gameOver();
                    return;
                }
            } else {
                meteors[i].draw();
            }
        }

        // Update & Draw Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw();
            if (particles[i].alpha <= 0) {
                particles.splice(i, 1);
            }
        }

        // Draw HUD (Live WPM & Accuracy)
        const liveMetrics = calculateMetrics();
        ctx.fillStyle = '#9ca3af';
        ctx.font = '14px "Courier New", Courier, monospace';
        ctx.fillText(`SCORE: ${score}`, 20, 30);
        ctx.fillText(`WPM: ${liveMetrics.wpm}`, 200, 30);
        ctx.fillText(`ACCURACY: ${liveMetrics.accuracy}%`, 360, 30);
        ctx.fillText(`ERRORS: ${liveMetrics.errorRate}%`, 560, 30);

        requestAnimationFrame(gameLoop);
    }

    // Event Listeners for UI buttons
    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    // Initial render call to display background cleanly
    initCities();
</script>

</body>
</html>
